name: Skill checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate and package skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"

      - name: Install hash-verified dependencies
        run: |
          uv venv --managed-python --python 3.12 .venv
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: --index-url https://pypi.org/simple requirements-dev.txt

      - name: Validate the skill and documentation links
        run: .venv/bin/python scripts/validate_skill.py

      - name: Test validation, packaging, and PR format checks
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build and verify the installable package
        run: .venv/bin/python scripts/build_skill.py

      - name: Upload the verified skill and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cult-like-launch-${{ github.sha }}
          path: |
            dist/cult-like-launch.zip
            dist/cult-like-launch.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish skill release
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified package from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cult-like-launch-${{ github.sha }}
          path: dist

      - name: Verify the release checksum
        working-directory: dist
        run: sha256sum --check cult-like-launch.zip.sha256

      - name: Publish the tagged version and its installable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/cult-like-launch.zip \
            dist/cult-like-launch.zip.sha256 \
            --verify-tag \
            --title "Cult-like Launch $RELEASE_TAG" \
            --generate-notes \
            --notes 'Download cult-like-launch.zip for Claude Chat or Cowork, then upload it under Customize → Skills. See the README for installation and source attribution.'
